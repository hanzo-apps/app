<svg viewBox="0 0 74 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lux Network" fill="#000">
  <!-- The LUX wordmark, text-only. The earlier lockup paired a delta mark with
       mixed-case "Lux"; the wall wants the plain caps wordmark. Single-color so
       brightness(0) invert(1) renders it clean white. -->
  <text x="0" y="30" font-family="Geist, Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="2">LUX</text>
</svg>
