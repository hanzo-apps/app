<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ensoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#333333;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Enso circle with brush-like stroke -->
  <path d="M 256 96 
           C 336 96, 400 160, 400 240
           C 400 320, 336 384, 256 384
           C 176 384, 112 320, 112 240
           C 112 180, 150 128, 205 108"
        fill="none" 
        stroke="url(#ensoGradient)" 
        stroke-width="32"
        stroke-linecap="round"
        opacity="0.9"
        transform="rotate(-45 256 256)"/>
  
  <!-- Add slight texture/imperfection to make it look hand-drawn -->
  <path d="M 256 96 
           C 336 96, 400 160, 400 240
           C 400 320, 336 384, 256 384
           C 176 384, 112 320, 112 240
           C 112 180, 150 128, 205 108"
        fill="none" 
        stroke="url(#ensoGradient)" 
        stroke-width="28"
        stroke-linecap="round"
        opacity="0.3"
        transform="rotate(-45 256 256) translate(2, -1)"
        stroke-dasharray="0,2,0,3,0,1"/>
</svg>