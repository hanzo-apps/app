name: Release
# Cuts a release of ghcr.io/hanzoai/app — the WEB app image the operator CR
# (universe: hanzo-app.yaml) pins. Mirrors hanzoai/cloud/release.yml exactly:
#     a git tag v<X.Y.Z>  ⇔  an image ghcr.io/hanzoai/app:v<X.Y.Z>
# Builds on the git.hanzo.ai native runner (git-runner; arcd retired) (NOT the GHCR-gated PaaS platform-build, and NOT
# the Rust CLI Release-Matrix). ghcr auth via GH_PAT / user hanzo-dev, same as cloud —
# this is the piece platform-build lacked (the `denied` failure).
on:
  push:
    branches: [main]
    # Workflow/doc-only edits must NOT cut a release (a scan tweak is not a new app
    # image). Real code changes on main still trigger; use workflow_dispatch to force.
    # (.hanzo/workflows was missing here since the .gitea→.hanzo move — workflow
    # edits were cutting no-op images.)
    paths-ignore:
      - '.github/**'
      - '.hanzo/workflows/**'
      - '**.md'
  workflow_dispatch:
permissions:
  contents: write
  packages: write
  id-token: write
concurrency:
  group: release-app
  cancel-in-progress: false
jobs:
  # Tests GATE the release: no image cut from a red suite. This is what let the
  # suite rot to 9 failing suites (incl. a real settings-page crash) unnoticed —
  # images kept shipping while `pnpm test` was never run anywhere.
  test:
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        # corepack, not `npm i -g pnpm@10`: the act runners persist
        # /opt/hostedtoolcache between jobs, so once any job has installed pnpm the
        # next one dies with EEXIST and the whole release fails before a single
        # test runs. corepack is also the only way the version actually matches —
        # it reads packageManager from package.json (pnpm@10.18.0), where the old
        # line just took "latest 10". Same mechanism the Dockerfile already uses.
        run: corepack enable pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck (tsc --noEmit — kept at ZERO errors since 2026-07-24)
        run: pnpm exec tsc --noEmit
      - name: Unit + integration + security suites (jest)
        run: pnpm test
      # ONE design system, and this is what keeps it one. `hanzo-design-lint`
      # ships in @hanzo/design and every Hanzo surface runs the same twelve
      # rules: eight about writing a VALUE that should have been a token, and
      # four about OWNING a layer that should have been imported — a second
      # `createGui` table, a second publisher of a name design declares, a local
      # header or search control. The layers are values→@hanzo/design,
      # structure→@hanzo/gui, chrome→@hanzogui/shell, components→@hanzo/ui; a
      # surface holds data and layout and nothing else.
      #
      # `hanzo-design.allow.json` is the ratchet: what this app still owes per
      # rule, shrinking only. A violation written today fails here. A count UNDER
      # its allowance fails too, so a fix deletes its own exemption in the same
      # commit rather than leaving room for the next author to regress into.
      - name: One design system (ratchet — hanzo-design.allow.json)
        run: pnpm lint:design

  build-amd64:
    needs: test
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - name: Checkout (full history + tags — version floor read from tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Compute next version (monotonic patch bump over the 1.42.x deploy line)
        id: ver
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        # The scan — the 1.42.-pinned tags ∪ registry union, and every incident
        # that shaped it — now lives in scripts/version.sh, unchanged. It moved
        # because hanzo.yml's gate has to run the SAME scan to check the file
        # this job writes, and a scan spelled twice is right twice and then wrong
        # once. `next` prints the number; the diagnostics go to stderr.
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          echo "version_v=v$(scripts/version.sh next)" >> "$GITHUB_OUTPUT"
      - name: Stamp package.json with the release version
        # The sidebar / about-modal / dashboard read `pkg.version` (lib/version.ts);
        # without this the image ships whatever version was last hand-committed
        # (was frozen at 1.42.21 while deploys ran ahead). Write the computed
        # release version into the build context so the shown version always
        # matches the deployed tag.
        #
        # This stamp is also what makes the COMMIT below honest: the tree that
        # gets tagged is byte-identical to the tree that was built, so the tag
        # names the bytes that shipped AND the number they call themselves.
        run: |
          v="${{ steps.ver.outputs.version_v }}"; v="${v#v}"
          sed -i.bak -E "s/(\"version\"[[:space:]]*:[[:space:]]*\")[^\"]+(\")/\1${v}\2/" package.json && rm -f package.json.bak
          echo "package.json -> $(grep -m1 '\"version\"' package.json)"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: network=host
      # ghcr auth: same as hanzoai/cloud — GH_PAT (a PAT with write:packages, user
      # hanzo-dev). The repo's old GHCR_TOKEN (Mar 2026) is stale/insufficient →
      # "denied". Add GH_PAT to the repo secrets (mirror cloud) and this ships.
      - name: Log in to ghcr.io (GH_PAT, write:packages — mirrors cloud)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: hanzo-dev
          password: ${{ secrets.GH_PAT }}
      # The publishable ingest key, from KMS — the only store secrets come from.
      # It used to read `secrets.PUBLISHABLE_KEY`, a repo secret, which put the
      # same credential in a second place with its own rotation story.
      #
      # Same KMS surface and same key name the shared hanzoai/ci reusable uses for
      # `build_secrets`, so the key has ONE name and ONE home no matter which
      # pipeline builds. This repo builds bespoke (it is not on the reusable), so
      # the fetch is spelled out here.
      #
      # ABSENCE IS FATAL, and it says which call failed.
      #
      # Each guard below used to end in `exit 0`, on the reasoning that a KMS hiccup
      # must not block shipping the product. Two things were wrong with that.
      #
      # It did not do what it says. The runner invokes `run:` under `bash -e`, so a
      # curl returning >= 400 aborted the step before any guard could print — the
      # sibling repo's build died exactly that way, as a bare `exitcode '22'` naming
      # neither call. Only the "call succeeded, value empty" path ever reached an
      # `exit 0`, and that path shipped a keyless image and went green.
      #
      # And an unkeyed bundle is not a degraded build. api.hanzo.ai refuses a
      # logged-out beacon that carries no resolvable key, and files what it does
      # accept under the reserved `$public` tenant that this org cannot read — while
      # answering 200 throughout. hanzo.app shipped a bundle whose key was silently
      # wrong for days and reported zero events the whole time; nothing went red.
      # A missing image is loud, a keyless one is not, so the missing image is the
      # better failure.
      #
      # Each curl is now rescued so the CHECK decides rather than the abort, and each
      # check fails the release naming the call that failed.
      - name: Fetch the ingest key from KMS
        id: ingest
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
          KMS_ENDPOINT: ${{ vars.KMS_ENDPOINT || 'https://api.hanzo.ai' }}
        run: |
          set -uo pipefail
          if [ -z "${KMS_CLIENT_ID:-}" ] || [ -z "${KMS_CLIENT_SECRET:-}" ]; then
            echo "::error::KMS credentials absent (KMS_CLIENT_ID/KMS_CLIENT_SECRET) — refusing to ship a bundle with no ingest key"
            exit 1
          fi
          TOKEN=$(curl -sS -m 30 "$KMS_ENDPOINT/v1/kms/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"$KMS_CLIENT_ID\",\"clientSecret\":\"$KMS_CLIENT_SECRET\"}" \
            2>/dev/null | jq -r '.accessToken // empty' || true)
          if [ -z "$TOKEN" ]; then
            echo "::error::KMS login failed at $KMS_ENDPOINT/v1/kms/auth/login — refusing to ship a bundle with no ingest key"; exit 1
          fi
          # Embedded KMS (HIP-0106): org from the token, flat {"value"}.
          V=$(curl -sS -m 30 "$KMS_ENDPOINT/v1/kms/secrets/deploy/PUBLISHABLE_KEY?env=prod" \
            -H "Authorization: Bearer $TOKEN" 2>/dev/null | jq -r '.value // empty' || true)
          if [ -z "$V" ]; then
            echo "::error::PUBLISHABLE_KEY absent from KMS (path deploy, env prod) — refusing to ship a bundle with no ingest key"; exit 1
          fi
          echo "::add-mask::$V"
          echo "key=$V" >> "$GITHUB_OUTPUT"
          echo "ingest key resolved (${#V} chars)"

      - name: Build + push ghcr.io/hanzoai/app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.production
          platforms: linux/amd64
          push: true
          tags: ghcr.io/hanzoai/app:${{ steps.ver.outputs.version_v }}
          provenance: false
          # Without this the bundle ships unkeyed and EVERY beacon is refused:
          # measured against the live door as a hard 401 `ingest_key_required`,
          # with and without a browser Origin, for pageviews and exceptions alike.
          # There is no anonymous lane admitting pageview+error — that lane is
          # described in several comments across this estate and is not implemented
          # in the deployed cloud, which is why "we still get errors, just not
          # events" was believed for so long. Nothing arrives.
          #
          # The name must stay PUBLISHABLE_KEY end to end: it is the name in KMS
          # and the ARG the Dockerfile declares. It did NOT used to be — the
          # Dockerfile declared NEXT_PUBLIC_PUBLISHABLE_KEY, so this value was
          # handed to a build that had nowhere to put it.
          build-args: |
            PUBLISHABLE_KEY=${{ steps.ingest.outputs.key }}
      - name: Verify the pushed image is pullable (guard the image ⇔ tag invariant)
        # build-push-action can exit 0 while the manifest isn't yet resolvable at the
        # registry (or a partial push). If we tag git anyway, the CR bump lands on a
        # phantom tag → ImagePullBackOff (exactly what bit v1.42.122). Prove the image
        # resolves BEFORE creating the git tag, so a bad push fails the run instead.
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version_v }}"
          for i in 1 2 3 4 5 6; do
            if docker manifest inspect "ghcr.io/hanzoai/app:${v}" >/dev/null 2>&1; then
              echo "image ${v} is resolvable — safe to tag"; exit 0
            fi
            echo "ghcr manifest ${v} not visible yet (attempt ${i}/6) — retrying"; sleep 5
          done
          echo "::error::image ${v} not pullable after push — refusing to tag git (prevents ImagePullBackOff)"; exit 1
      - name: Tag the release (image ⇔ tag ⇔ package.json invariant)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        # THE TAG NAMES A COMMIT THAT DECLARES ITS OWN VERSION. The stamp step
        # above already wrote the number into package.json for the build, so this
        # commits the exact tree that was built and tags THAT — no rebase, no
        # re-stamp, nothing tagged that was not compiled.
        #
        # Before this, the stamp lived only in the build context and was thrown
        # away with the runner. package.json on main therefore drifted one patch
        # per release and reached 1.42.211 against a published v1.42.353 — 141
        # behind, and invisible, because the scan reads the file as nothing.
        #
        # `[skip ci]` because release.yml triggers on any push to main that is not
        # workflow/docs, and package.json is deliberately NOT in paths-ignore (a
        # dependency bump IS a release). Both remotes honour it — git.hanzo.ai via
        # Gitea's SKIP_WORKFLOW_STRINGS default, github.com natively — so the
        # write-back cannot re-enter this workflow.
        run: |
          set -euo pipefail
          git config user.name 'hanzo-ci'
          git config user.email 'ci@hanzo.ai'
          git add package.json
          git commit -m "release ${{ steps.ver.outputs.version_v }} [skip ci]"
          git tag "${{ steps.ver.outputs.version_v }}"
          git push origin "${{ steps.ver.outputs.version_v }}"
          # Mirror the tag to GitHub so both remotes agree on the release
          # lineage (was a manual step after every native release). Fail-soft:
          # a mirror hiccup must not invalidate the already-pushed image+tag.
          if [ -n "${GH_PAT:-}" ]; then
            git push "https://x-access-token:${GH_PAT}@github.com/hanzoai/app.git" \
              "refs/tags/${{ steps.ver.outputs.version_v }}" \
              && echo "tag mirrored to GitHub" \
              || echo "GitHub tag mirror failed (non-fatal — mirror by hand: git push origin ${{ steps.ver.outputs.version_v }})"
          fi

      # THE DEPLOY, AND THE ONLY ONE. cd.hanzo.ai watches hanzoai/universe — a git
      # generator over charts/app/values/*/*.yaml — not the registry. Until the
      # values file moves, a pushed image is bytes nothing points at.
      #
      # This step used to be a sentence: "Pushed image + tag … — bump the operator
      # CR (universe: hanzo-app.yaml) to deploy." Whether a release shipped then
      # depended on whether a person read the log, and mostly it did not: v1.42.224
      # built green and was still not running 13 minutes later, while the profile
      # fix it carried was reported broken by the user who asked for it.
      #
      # pin.sh is the fleet's one pinning path (its own header documents the same
      # outage class elsewhere). It resolves tag AND digest from ONE registry GET,
      # so the pair cannot drift — two lookups at two moments is exactly how a pin
      # comes to name one image and run another, and that failure SUCCEEDS: the pod
      # reports the tag and serves the other bytes.
      - name: Ship it (pin universe → cd.hanzo.ai deploys)
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
          KMS_ENDPOINT: ${{ vars.KMS_ENDPOINT || 'https://api.hanzo.ai' }}
          KMS_ORG: ${{ vars.KMS_ORG || 'hanzo' }}
          KMS_SECRET_ENV: ${{ vars.KMS_SECRET_ENV || 'prod' }}
          # pin.sh probes the registry before it moves anything; these let it read
          # a private manifest instead of falling back to anonymous.
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version_v }}"

          # Secrets come from KMS, never from a file or a repo variable.
          KMS_TOKEN=$(curl -fsS "${KMS_ENDPOINT}/v1/kms/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"${KMS_CLIENT_ID}\",\"clientSecret\":\"${KMS_CLIENT_SECRET}\"}" \
            | jq -r '.accessToken // empty')
          [ -n "$KMS_TOKEN" ] || { echo "::error::KMS login failed at ${KMS_ENDPOINT} — image ${VERSION} is pushed but NOT deployed"; exit 1; }

          PIN_TOKEN=$(curl -fsS \
            "${KMS_ENDPOINT}/v1/kms/secrets/deploy/UNIVERSE_PIN_TOKEN?env=${KMS_SECRET_ENV}" \
            -H "Authorization: Bearer ${KMS_TOKEN}" | jq -r '.value // empty')
          [ -n "$PIN_TOKEN" ] || { echo "::error::UNIVERSE_PIN_TOKEN missing in KMS at ${KMS_ORG}/deploy (env ${KMS_SECRET_ENV}) — image ${VERSION} is pushed but NOT deployed"; exit 1; }
          echo "::add-mask::${PIN_TOKEN}"

          git clone --quiet --depth 1 \
            "https://x-access-token:${PIN_TOKEN}@git.hanzo.ai/hanzo/universe" /tmp/universe

          # Another service can land its own pin between our clone and our push. A
          # shallow clone has no common history to rebase onto, so RE-APPLY rather
          # than merge. Pinning is idempotent and derives everything from the file
          # it finds, so the retry also re-checks the monotonic guard.
          for attempt in 1 2 3 4 5; do
            /tmp/universe/charts/app/pin.sh hanzo-app "$VERSION"

            if git -C /tmp/universe push --quiet origin HEAD:main 2>/dev/null; then
              echo "pinned hanzo-app to ${VERSION} — cd.hanzo.ai rolls it out"; exit 0
            fi

            echo "universe moved under us (attempt ${attempt}/5) — re-applying on the new tip"
            git -C /tmp/universe fetch --quiet --depth 1 origin main
            git -C /tmp/universe reset --quiet --hard origin/main
          done
          echo "::error::could not push the pin after 5 attempts — image ${VERSION} is pushed but NOT deployed"; exit 1

      # There is no release commit onto main, deliberately. The version is DERIVED
      # — `scripts/version.sh next` scans the tags union the registry — so main
      # never held the floor, only a copy of it. Keeping that copy honest needed a
      # push to a protected branch, which the forge refuses for the Actions token,
      # so every release ended RED having already built, pushed, tagged and pinned
      # its image. A red run that means "shipped fine" is worse than no signal.
      #
      # What still writes the number is the stamp above, into the BUILD CONTEXT:
      # lib/version.ts reads pkg.version for the sidebar and the about modal, so
      # the image says what it is. That is the number's only job. The tag names
      # the built tree and the pin names the digest; nothing has to be kept in
      # step with anything, because there is one source and it is the registry.
